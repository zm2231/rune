[package]
name = "ios-perf"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
procwatch = { workspace = true }
rune = { workspace = true, default-features = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes", "objc2"] }
objc2-foundation = { workspace = true, features = ["std", "NSString"] }

[lints]
workspace = true
