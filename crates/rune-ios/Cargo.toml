[package]
name = "rune-ios"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Hosts a Rune app on iPhone: a UIKit view on a CAMetalLayer, a display link up to 120 Hz, touches, safe areas, haptics and the scene lifecycle."

[dependencies]
rune = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
dispatch2 = { workspace = true, features = ["std", "objc2"] }
objc2 = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSDate", "NSDictionary", "NSEnumerator", "NSNotification", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSSet", "NSString"] }
objc2-quartz-core = { workspace = true, features = ["std", "CABase", "CADisplayLink", "CAFrameRateRange", "objc2-core-foundation"] }
objc2-ui-kit = { workspace = true, features = ["std", "objc2-core-foundation", "objc2-quartz-core", "UIAccessibility", "UIApplication", "UIEvent", "UIFeedbackGenerator", "UIGeometry", "UIImpactFeedbackGenerator", "UIInterface", "UINotificationFeedbackGenerator", "UIResponder", "UIScene", "UISceneConfiguration", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UISelectionFeedbackGenerator", "UITouch", "UITraitCollection", "UIView", "UIViewController", "UIWindow", "UIWindowScene"] }

[lints]
workspace = true
