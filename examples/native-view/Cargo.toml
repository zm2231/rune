[package]
name = "native-view"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
rune = { workspace = true, default-features = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wry = "0.58"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXError"] }
libc = "0.2"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString"] }

[lints]
workspace = true
